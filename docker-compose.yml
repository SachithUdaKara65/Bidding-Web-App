services:
  api:
    container_name: procurement-api
    build:
      context: .
      dockerfile: infrastructure/containers/Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - API_PORT=3001
      - API_HOST=0.0.0.0
      - WEB_ORIGIN=http://localhost:3000
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    networks:
      - procurement-network
    restart: unless-stopped

  web:
    container_name: procurement-web
    build:
      context: .
      dockerfile: infrastructure/containers/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
    networks:
      - procurement-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  procurement-network:
    driver: bridge
